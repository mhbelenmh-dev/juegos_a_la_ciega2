<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>64 Sombras</title>
    <link rel="icon" type="image/png" href="caballo-solo.jpg.png">    

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        :root { --bg: #1a1917; --panel: #262421; --accent: #e5bf00; --blue: #3692e7; --green: #629924; --red: #cc3333; --text: #bababa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }

        /* HEADER UNIFICADO */
        #top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: #000; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 100; }
        #brand-logo { margin: 0; font-size: 1.8em; color: var(--accent); letter-spacing: 1px; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); text-decoration: none; }
        #nav-menu { display: flex; gap: 25px; align-items: center; }
        .nav-link { color: var(--green); text-decoration: none; font-weight: bold; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; padding: 5px 10px; border-radius: 5px; white-space: nowrap;}
        .nav-link:hover { color: #fff; background: rgba(98, 153, 36, 0.2); transform: scale(1.05); }

        #analysis-layout { margin-top: 100px; display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 30px; padding: 20px; flex-wrap: wrap; }

        /* TABLERO */
        #board-wrapper { width: 100%; max-width: 500px; display: flex; flex-direction: column; }
        #tablero { width: 100%; border: 6px solid #3d3a37; border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); touch-action: none !important; }

        .controls-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-ctrl { flex: 1; background: #444; color: white; border: none; padding: 15px; font-size: 1.1em; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #222; transition: 0.2s; }
        .btn-ctrl:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 6px 0 #222;}
        .btn-ctrl:active { transform: translateY(2px); box-shadow: none; }

        /* PANEL */
        .info-panel { background: var(--panel); border: 1px solid #444; border-radius: 12px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #status-box { font-size: 1.4em; font-weight: bold; color: #fff; background: #111; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; margin-bottom: 20px; border-left: 5px solid var(--accent); }
        .data-label { color: #888; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; font-weight: bold;}
        
        #historial-container { background: #1a1917; padding: 8px; border-radius: 6px; border: 1px solid #444; max-height: 300px; overflow-y: auto; margin-bottom: 15px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        
        /* LA MAGIA DEL GRID (ESTILO LICHESS) */
        .grid-historial { display: grid; grid-template-columns: 45px 1fr 1fr; gap: 4px; align-items: center; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 1.05em; }
        .hist-num { background: #262421; color: #888; text-align: center; padding: 6px 0; border-radius: 4px; font-size: 0.9em; user-select: none; font-weight: bold; }
        .hist-move { padding: 6px 10px; border-radius: 4px; cursor: pointer; color: var(--text); transition: 0.1s; text-align: center; }
        .hist-move:hover { background: rgba(255, 255, 255, 0.1); }
        .hist-move.selected { background: var(--accent); color: #000; font-weight: bold; box-shadow: 0 2px 0 rgba(0,0,0,0.5); }
        
        textarea, input[type="text"] { width: 100%; background: #1a1917; color: var(--accent); border: 1px solid #555; padding: 12px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 1.1em; box-sizing: border-box; margin-bottom: 10px; outline: none; resize: vertical; }
        textarea:focus, input[type="text"]:focus { border-color: var(--blue); }
        
        .btn-cargar { background: var(--blue); color: white; border: none; padding: 10px 15px; font-size: 1em; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 0 #20629c; transition: 0.2s; margin-bottom: 20px; text-transform: uppercase;}
        .btn-cargar:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* MOTOR */
        #engine-box { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 25px; }
        .engine-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        #btn-motor { background: #444; color: #fff; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .engine-stats { display: flex; justify-content: space-between; font-size: 1.1em; color: #ccc;}
    </style>
</head>

<body>

    <div id="top-bar">
        <a href="index.html" id="brand-logo">
            <img src="caballo.jpg" alt="64 Sombras Logo" style="height: 50px; width: auto;">
        </a>        
        <div id="nav-menu">
            <a href="hub_basico.html" class="nav-link">TABLERO</a>
            <a href="hub_memoria.html" class="nav-link">MEMORIA</a>
            <a href="hub_tactica.html" class="nav-link">TÁCTICA</a>
            <a href="hub_torneos.html" class="nav-link">TORNEOS</a>
            <a href="analisis.html" class="nav-link" style="color: #fff; border-bottom: 2px solid var(--accent);">ANÁLISIS</a>
            <a href="bot_ciego.html" class="nav-link">JUGAR</a>            
            <a href="baul.html" class="nav-link">📦 BAÚL</a>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button onclick="window.location.href='index.html'" style="background: #444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;" onmouseover="this.style.background='#555'" onmouseout="this.style.background='#444'">⬅ Volver al Inicio</button>
        </div>
    </div>

    <div id="analysis-layout">
        
        <div id="board-wrapper">
            <div id="tablero"></div>
            <div class="controls-row">
                <button class="btn-ctrl" onclick="retroceder()" title="Deshacer Movimiento">⏮️ Atrás</button>
                <button class="btn-ctrl" onclick="avanzar()" title="Avanzar Solución">⏭️ Adelante</button>
                <button class="btn-ctrl" onclick="girarTablero()">🔃 Girar</button>
                <button class="btn-ctrl" style="background: var(--danger); box-shadow: 0 4px 0 #8a1f1f;" onclick="reiniciarTablero()">🔄 Reset</button>
            </div>
        </div>

        <div class="info-panel">
            
            <div id="status-box">Juegan Blancas</div>

            <div id="engine-box">
                <div class="engine-header">
                    <strong style="color: var(--blue); font-size: 1.2em;">🤖 Módulo de Análisis</strong>
                    <button id="btn-motor" onclick="toggleMotor()">APAGADO</button>
                </div>
                <div class="engine-stats">
                    <span>Eval: <strong id="eval-score" style="color: #888;">-</strong></span>
                    <span>Mejor Jugada: <strong id="eval-bestmove" style="color: var(--accent);">-</strong></span>
                </div>
            </div>

            <label class="data-label">📝 Historial de Jugadas (Árbol):</label>
            <div id="historial-container">Sin movimientos...</div>
            <div id="subvariantes-container" style="display: none;"></div>

            <label class="data-label" style="margin-top: 15px;">📥 Exportar/Importar PGN:</label>
            <textarea id="pgn-data" rows="3" placeholder="Pega un PGN aquí..."></textarea>
            <button class="btn-cargar" onclick="cargarPGNUsuario()">Cargar Partida PGN</button>

            <div style="padding-top: 10px; border-top: 1px solid #444;">
                <label class="data-label" style="color: var(--green);">⚙️ Posición Exacta (FEN):</label>
                <input type="text" id="fen-data" placeholder="Pega un FEN aquí...">
                <button class="btn-cargar" style="background: var(--green); box-shadow: 0 4px 0 #4a751b;" onclick="cargarFENUsuario()">Cargar Posición FEN</button>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <script src="utils.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        
        let engine = null;
        let engineActive = false;
        let timerMotor = null; 

        // --- EL NUEVO ÁRBOL DE MULTIVERSOS ---
        let arbolVariantes = { id: 0, fen: "start", san: "START", color: null, hijos: [], padre: null };
        let nodoActual = arbolVariantes;
        let nodoCounter = 0;
        let mapaNodos = { 0: arbolVariantes };

        const statusBox = document.getElementById('status-box');
        const pgnData = document.getElementById('pgn-data');
        const fenData = document.getElementById('fen-data');

        function cargarMotor() {
            fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
                .then(response => response.text())
                .then(text => {
                    const blob = new Blob([text], {type: 'application/javascript'});
                    engine = new Worker(URL.createObjectURL(blob));
                    
                    engine.onmessage = function(event) {
                        let msg = event.data;
                        if (msg.includes("score cp") || msg.includes("score mate")) {
                            let scoreMatch = msg.match(/score (cp|mate) (-?\d+)/);
                            if (scoreMatch) {
                                let type = scoreMatch[1];
                                let val = parseInt(scoreMatch[2]);
                                let displayScore = "";
                                let isBlackTurn = game.turn() === 'b';
                                
                                if (type === 'cp') {
                                    if (isBlackTurn) val = -val;
                                    displayScore = (val / 100).toFixed(2);
                                    if (val > 0) displayScore = "+" + displayScore;
                                } else { 
                                    if (isBlackTurn) val = -val;
                                    displayScore = "M" + Math.abs(val);
                                    if (val > 0) displayScore = "+" + displayScore;
                                    else displayScore = "-" + displayScore;
                                }
                                
                                let scoreElem = document.getElementById('eval-score');
                                scoreElem.innerText = displayScore;
                                if (val > 50) scoreElem.style.color = "var(--success)";
                                else if (val < -50) scoreElem.style.color = "var(--danger)";
                                else scoreElem.style.color = "#fff";
                            }
                        }
                        
                        if (msg.includes(" pv ")) {
                            let pvMatch = msg.match(/pv\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
                            if (pvMatch) document.getElementById('eval-bestmove').innerText = pvMatch[1];
                        } else if (msg.startsWith("bestmove")) {
                            let parts = msg.split(" ");
                            let best = parts[1];
                            if(best && best !== "(none)") document.getElementById('eval-bestmove').innerText = best;
                        }
                    };
                    engine.postMessage("uci"); 
                })
                .catch(e => console.warn("El motor de análisis no se pudo cargar."));
        }

        // ==========================================
        // LA NAVEGACIÓN POR EL ÁRBOL
        // ==========================================
        function saltarANodo(id) {
            let destino = mapaNodos[id];
            if (!destino) return;
            
            game.load(arbolVariantes.fen); // Volvemos al origen del árbol
            let camino = [];
            let temp = destino;
            while(temp.padre !== null) {
                camino.unshift(temp.san);
                temp = temp.padre;
            }
            for(let san of camino) {
                game.move(san); // Reconstruimos la historia hasta el nodo
            }
            nodoActual = destino;
            board.position(game.fen());
            actualizarUI();
        }

        // Retroceder en la historia (Atrás)
        function retroceder() {
            if (nodoActual.padre !== null) {
                game.undo();
                nodoActual = nodoActual.padre;
                board.position(game.fen());
                actualizarUI();
            }
        }

        // Avanzar en la historia (Adelante)
        function avanzar(indiceVariante = 0) {
            if (nodoActual.hijos.length > 0) {
                let hijo = nodoActual.hijos[indiceVariante]; 
                game.move(hijo.san);
                nodoActual = hijo;
                board.position(game.fen());
                actualizarUI();
            }
        }

        // ==========================================
        // LÓGICA DEL TABLERO
        // ==========================================
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            let esCoronacion = false;
            let pieza = game.get(source);
            if (pieza && pieza.type === 'p') {
                if ((pieza.color === 'w' && target.charAt(1) === '8') || 
                    (pieza.color === 'b' && target.charAt(1) === '1')) {
                    esCoronacion = true;
                }
            }

            let piezaCoronada = 'q';
            if (esCoronacion) {
                let respuesta = prompt("¿Qué pieza quieres? (D=Dama, T=Torre, C=Caballo, A=Alfil)", "D");
                if (respuesta) {
                    let inicial = respuesta.toLowerCase().charAt(0);
                    if (inicial === 't' || inicial === 'r') piezaCoronada = 'r';
                    else if (inicial === 'c' || inicial === 'n') piezaCoronada = 'n';
                    else if (inicial === 'a' || inicial === 'b') piezaCoronada = 'b';
                }
            }

            let testMove = game.move({ from: source, to: target, promotion: piezaCoronada });
            if (testMove === null) return 'snapback';

            // --- MAGIA DEL MULTIVERSO: RAMIFICAMOS ---
            let varianteExistente = nodoActual.hijos.find(h => h.san === testMove.san);
            
            if (varianteExistente) {
                nodoActual = varianteExistente;
            } else {
                nodoCounter++;
                let nuevoNodo = { 
                    id: nodoCounter, fen: game.fen(), san: testMove.san, 
                    color: testMove.color, hijos: [], padre: nodoActual 
                };
                nodoActual.hijos.push(nuevoNodo);
                mapaNodos[nuevoNodo.id] = nuevoNodo;
                nodoActual = nuevoNodo; 
            }

            if(typeof reproducirSonido === 'function') reproducirSonido('correcto');
            actualizarUI();
        }

        function onSnapEnd() { board.position(game.fen()); }

        // ==========================================
        // LA INTERFAZ INTELIGENTE (ESTILO LICHESS COMPLETO)
        // ==========================================
        function actualizarUI() {
            // 1. TEXTO DE ESTADO
            let statusHTML = '';
            let bando = (game.turn() === 'w') ? 'Blancas' : 'Negras';
            let colorTexto = (game.turn() === 'w') ? '#fff' : 'var(--danger)';

            if (game.in_checkmate()) { statusHTML = `🏆 Jaque Mate. Pierden <span style="color:${colorTexto};">${bando}</span>`; if(typeof reproducirSonido === 'function') reproducirSonido('fin'); } 
            else if (game.in_draw()) { statusHTML = "🤝 Tablas / Empate"; } 
            else {
                statusHTML = `Juegan <span style="color:${colorTexto}; text-transform:uppercase;">${bando}</span>`;
                if (game.in_check()) statusHTML += ` <br><span style="color:var(--accent); font-size:0.8em;">(¡Están en Jaque!)</span>`;
            }

            statusBox.innerHTML = statusHTML;
            fenData.value = game.fen();

            // 2. CONSTRUIR EL CAMINO ENTERO (PASADO + FUTURO DE LA LÍNEA PRINCIPAL)
            let pasado = [];
            let temp = nodoActual;
            while(temp.padre !== null) {
                pasado.unshift(temp);
                temp = temp.padre;
            }

            let futuro = [];
            let tempFuturo = nodoActual;
            while(tempFuturo.hijos && tempFuturo.hijos.length > 0) {
                tempFuturo = tempFuturo.hijos[0]; // Caminamos hacia el futuro por la primera variante
                futuro.push(tempFuturo);
            }

            // Unimos pasado y futuro en una sola tira de movimientos continuos
            let camino = pasado.concat(futuro);

            let html = "<div class='grid-historial'>"; 
            let pgnExport = "";
            let moveNum = parseInt(arbolVariantes.fen.split(' ')[5]) || 1;

            if (camino.length === 0) {
                html += "<div style='grid-column: 1 / -1; color: #666; text-align: center; padding: 15px;'>Posición inicial</div>";
            }

            let idx = 0;
            // Si el FEN inicial arranca en el turno de las negras
            if (camino.length > 0 && camino[0].color === 'b') {
                let n = camino[0];
                let isSelected = (n.id === nodoActual.id) ? "selected" : "";
                html += `<div class="hist-num">${moveNum}</div>`;
                html += `<div class="hist-move" style="color: #444; pointer-events: none;">...</div>`;
                html += `<div class="hist-move ${isSelected}" onclick="saltarANodo(${n.id})">${n.san}</div>`;
                pgnExport += `${moveNum}... ${n.san} `;
                moveNum++;
                idx = 1;
            }

            // Renderizado por parejas en columnas (Grid) sin recortar nada por ir hacia atrás
            while (idx < camino.length) {
                let nBlanca = camino[idx];
                let isSelectedB = (nBlanca.id === nodoActual.id) ? "selected" : "";
                
                html += `<div class="hist-num">${moveNum}</div>`;
                html += `<div class="hist-move ${isSelectedB}" onclick="saltarANodo(${nBlanca.id})">${nBlanca.san}</div>`;
                pgnExport += `${moveNum}. ${nBlanca.san} `;
                
                if (idx + 1 < camino.length) {
                    let nNegra = camino[idx + 1];
                    let isSelectedN = (nNegra.id === nodoActual.id) ? "selected" : "";
                    html += `<div class="hist-move ${isSelectedN}" onclick="saltarANodo(${nNegra.id})">${nNegra.san}</div>`;
                    pgnExport += `${nNegra.san} `;
                } else {
                    html += `<div class="hist-move" style="pointer-events: none;"></div>`;
                }
                
                moveNum++;
                idx += 2;
            }
            
            html += "</div>"; 
            
            let contenedor = document.getElementById('historial-container');
            contenedor.innerHTML = html;
            
            // Auto-scroll inteligente: persigue y centra suavemente la jugada activa, esté arriba o abajo
            let elementoSeleccionado = contenedor.querySelector('.hist-move.selected');
            if (elementoSeleccionado) {
                elementoSeleccionado.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
                contenedor.scrollTop = contenedor.scrollHeight;
            }

            pgnData.value = pgnExport.trim();

            // 3. CAJA DE SUBVARIANTES (Se activa solo cuando hay cruces de caminos)
            let contenedorSub = document.getElementById('subvariantes-container');
            if (nodoActual.hijos.length > 1) {
                let subHtml = "<div style='color:var(--blue); font-size:0.9em; margin-bottom:8px; text-transform:uppercase;'>Subvariantes desde aquí:</div>";
                for (let i = 0; i < nodoActual.hijos.length; i++) {
                    let hijo = nodoActual.hijos[i];
                    let colorBtn = (i === 0) ? "var(--green)" : "#444"; 
                    subHtml += `<button onclick="avanzar(${i})" style="background:${colorBtn}; color:#fff; border:none; padding:8px 12px; border-radius:4px; margin:2px; cursor:pointer; font-weight:bold; box-shadow: 0 3px 0 rgba(0,0,0,0.5);">${hijo.san}</button> `;
                }
                contenedorSub.innerHTML = subHtml;
                contenedorSub.style.display = 'block';
            } else {
                contenedorSub.style.display = 'none';
            }

            // 4. DISPARAR STOCKFISH
            analizarPosicion();
        }

        function girarTablero() { board.flip(); }

        function reiniciarTablero() {
            game.reset();
            arbolVariantes = { id: 0, fen: game.fen(), san: "START", color: null, hijos: [], padre: null };
            nodoActual = arbolVariantes;
            nodoCounter = 0;
            mapaNodos = { 0: arbolVariantes };
            board.position('start');
            board.orientation('white');
            actualizarUI();
        }

        function cargarFENUsuario() {
            let inputFen = fenData.value.trim();
            if(inputFen === '') return;
            let valid = game.load(inputFen);
            if (valid) {
                arbolVariantes = { id: 0, fen: game.fen(), san: "START", color: null, hijos: [], padre: null };
                nodoActual = arbolVariantes;
                nodoCounter = 0;
                mapaNodos = { 0: arbolVariantes };
                board.position(game.fen());
                actualizarUI();
            } else { alert("Código FEN inválido."); fenData.value = game.fen(); }
        }

        function cargarPGNUsuario() {
            let inputPgn = pgnData.value.trim();
            if(inputPgn === '') { reiniciarTablero(); return; }
            
            let tempGame = new Chess();
            if(tempGame.load_pgn(inputPgn)) {
                let moves = tempGame.history({verbose:true});
                let head = tempGame.header();
                let startFen = head.FEN || "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
                
                game.load(startFen);
                
                arbolVariantes = { id: 0, fen: game.fen(), san: "START", color: null, hijos: [], padre: null };
                nodoActual = arbolVariantes;
                nodoCounter = 0;
                mapaNodos = { 0: arbolVariantes };

                for(let m of moves) {
                    game.move(m.san);
                    nodoCounter++;
                    let nuevoNodo = { id: gateway = nodoCounter, fen: game.fen(), san: m.san, color: m.color, padre: nodoActual, hijos: [] };
                    nodoActual.hijos.push(nuevoNodo);
                    mapaNodos[nuevoNodo.id] = nuevoNodo;
                    nodoActual = nuevoNodo;
                }
                board.position(game.fen());
                actualizarUI();
            } else {
                alert("Notación PGN inválida o contiene movimientos ilegales.");
            }
        }

        function toggleMotor() {
            let btn = document.getElementById('btn-motor');
            if(!engine) { alert("El motor aún está cargando o fue bloqueado por el navegador."); return; }
            engineActive = !engineActive;
            if(engineActive) {
                btn.style.background = 'var(--success)';
                btn.innerText = 'ENCENDIDO';
                analizarPosicion();
            } else {
                btn.style.background = '#444';
                btn.innerText = 'APAGADO';
                engine.postMessage("stop");
                document.getElementById('eval-score').innerText = "-";
                document.getElementById('eval-bestmove').innerText = "-";
                document.getElementById('eval-score').style.color = "#888";
            }
        }

        function analizarPosicion() {
            if(!engine || !engineActive) return;
            
            document.getElementById('eval-score').innerText = "Pensando...";
            document.getElementById('eval-bestmove').innerText = "...";
            
            clearTimeout(timerMotor);
            
            timerMotor = setTimeout(() => {
                engine.postMessage("stop");
                engine.postMessage("position fen " + game.fen());
                engine.postMessage("go depth 20"); 
            }, 300);
        }

        // ==========================================
        // INICIO AL CARGAR LA PÁGINA
        // ==========================================
        let config = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('tablero', config);
        cargarMotor(); 
        
        arbolVariantes.fen = game.fen(); 

        // --- ENRUTADOR DESDE EL BAÚL (DE ERRORES) ---
        const urlParams = new URLSearchParams(window.location.search);
        const fenParam = urlParams.get('fen');
        const solParam = urlParams.get('solucion');

        if (fenParam) {
            let valid = game.load(fenParam);
            if (valid) {
                board.position(game.fen());
                arbolVariantes.fen = game.fen(); 
                nodoActual = arbolVariantes; 
                
                if (solParam) {
                    let moves = solParam.trim().split(/\s+/);
                    
                    for (let m of moves) {
                        if (!m) continue;
                        let moveResult = game.move(m, {sloppy: true});
                        if (!moveResult && m.length >= 4) {
                            let f = m.substring(0, 2); let t = m.substring(2, 4); let p = m.length > 4 ? m.substring(4, 5) : 'q';
                            moveResult = game.move({ from: f, to: t, promotion: p });
                        }
                        if (moveResult) {
                            nodoCounter++;
                            let nuevoNodo = { id: nodoCounter, fen: game.fen(), san: moveResult.san, color: moveResult.color, padre: nodoActual, hijos: [] };
                            nodoActual.hijos.push(nuevoNodo);
                            mapaNodos[nuevoNodo.id] = nuevoNodo;
                            nodoActual = nuevoNodo;
                        } else {
                            break;
                        }
                    }

                    // Rebobinamos al origen para que empiece desde la posición inicial del fallo
                    while (nodoActual.padre !== null) {
                        game.undo();
                        nodoActual = nodoActual.padre;
                    }
                    board.position(game.fen());
                }
            }
        }
        
        actualizarUI();

    </script>
</body>
</html>
